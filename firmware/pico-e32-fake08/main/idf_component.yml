## IDF Component Manager manifest for the fake-08 app.
## esp_codec_dev provides the ES8311 codec driver (audio_codec_* + es8311_codec_new + esp_codec_dev_*)
## used by the P4 board's board_audio_* seam (GP-6). The S3 board has no audio hardware and does not use
## it, but the app is shared, so the dependency is declared once here.
##
## esp_wifi_remote + esp_hosted are pulled ONLY on the ESP32-P4 (rules/if idf_target): the P4 has no radio,
## so WiFi is delegated over esp-hosted (SDIO) to the on-board ESP32-C6. The S3 uses its native esp_wifi and
## does not need them. See components/wifi. (WC-3 / Gate 4.)
dependencies:
  espressif/esp_codec_dev: "^1.3.4"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
